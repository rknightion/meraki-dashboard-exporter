name: CodeQL
on:
  push:
    branches: [main]
  schedule:
    - cron: '39 3 * * 3'
permissions: {}
jobs:
  codeql:
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    uses: rknightion/.github/.github/workflows/codeql.yml@6368cfb938f61a7f307c84215a79b9d1aafff25b # v1.30.26
    with:
      languages: '[{"language":"python","build-mode":"none"},{"language":"actions","build-mode":"none"}]'
