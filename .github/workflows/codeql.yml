name: CodeQL
on:
  push:
    branches: [main]
  schedule:
    - cron: '39 3 * * 3'
permissions: {}
jobs:
  codeql:
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    uses: rknightion/.github/.github/workflows/codeql.yml@0f4847f833f096c1f03284481d7e6b19c2f81c30 # v1.25.8
    with:
      languages: '[{"language":"python","build-mode":"none"},{"language":"actions","build-mode":"none"}]'
