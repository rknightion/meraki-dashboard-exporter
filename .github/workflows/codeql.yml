name: CodeQL
on:
  push:
    branches: [main]
  schedule:
    - cron: '39 3 * * 3'
permissions: {}
jobs:
  codeql:
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    uses: rknightion/.github/.github/workflows/codeql.yml@fbbe02606f227a9500548b15dc626ff1a00d0f60 # v1.31.2
    with:
      languages: '[{"language":"python","build-mode":"none"},{"language":"actions","build-mode":"none"}]'
