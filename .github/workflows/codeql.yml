name: CodeQL
on:
  push:
    branches: [main]
  schedule:
    - cron: '39 3 * * 3'
permissions: {}
jobs:
  codeql:
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    uses: rknightion/.github/.github/workflows/codeql.yml@9278035a95cca2de3e202817e536fc7f9fc774fc # v1.34.0
    with:
      languages: '[{"language":"python","build-mode":"none"},{"language":"actions","build-mode":"none"}]'
      timeout-minutes: 30
