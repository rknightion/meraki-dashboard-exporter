name: CodeQL
on:
  push:
    branches: [main]
  schedule:
    - cron: '39 3 * * 3'
permissions: {}
jobs:
  codeql:
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    uses: rknightion/.github/.github/workflows/codeql.yml@7be903bd193f76b1a590cbe54943a9bf9592ce45 # v1.18.0
    with:
      languages: '[{"language":"python","build-mode":"none"},{"language":"actions","build-mode":"none"}]'
