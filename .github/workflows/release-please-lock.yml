name: Release Please Lock

# release-please bumps the version in pyproject.toml but has no uv.lock updater, so the
# release PR ships a uv.lock whose own-package version is one release behind. That fails
# CI's `uv sync --locked`. This workflow reacts to the release PR, regenerates uv.lock, and
# pushes the result back under the PAT (so CI re-runs), leaving the lock consistent for merge.
# It is idempotent: once locked, `uv lock` produces no diff, so it self-terminates.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

# Workflow-level lockdown; each job grants only what it needs. The push authenticates with a
# GitHub App installation token minted per run from the OpenBao broker, not GITHUB_TOKEN, so no
# contents:write is needed on the job itself.
#
# NOTE: until 2026-08-08 the author guard below listed only github-actions[bot] and
# release-please[bot], while the release PR was actually opened by `rknightion` (the PAT
# identity) -- so this workflow was dead: EVERY run skipped, and uv.lock was never
# regenerated. The App identity is now listed first.
permissions: {}

concurrency:
  group: release-please-lock-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  relock:
    name: Regenerate uv.lock
    # Only release-please PRs from this repository. The secret-bearing push runs in a
    # separate job that never executes PR-controlled dependency/build metadata.
    if: >-
      startsWith(github.head_ref, 'release-please--') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.pull_request.user.login == 'rknightion-token-broker[bot]' ||
       github.event.pull_request.user.login == 'github-actions[bot]' ||
       github.event.pull_request.user.login == 'release-please[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Regenerate lockfile
        run: uv lock

      - name: Check for lockfile changes
        id: diff
        run: |
          set -euo pipefail
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already in sync — nothing to do"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Upload regenerated lockfile
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: regenerated-uv-lock
          path: uv.lock
          if-no-files-found: error

  push-lockfile:
    name: Push regenerated uv.lock
    needs: relock
    if: needs.relock.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # exchanged for a tailnet identity and an OpenBao token
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false

      - name: Download regenerated lockfile
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: regenerated-uv-lock

      # A distinct permission set from release-please's, because this is the only
      # PULL_REQUEST-triggered consumer: its OpenBao role cannot bind
      # ref=refs/heads/main like the others, so it binds event_name=pull_request
      # plus this exact workflow_ref instead.
      - name: Mint a scoped push token
        id: bao
        uses: rknightion/.github/.github/actions/broker-token@7be903bd193f76b1a590cbe54943a9bf9592ce45 # v1.18.0
        with:
          permission-set: lockfile-meraki-dashboard-exporter
          role: lockfile-meraki-dashboard-exporter
          tailscale-client-id: ${{ secrets.TS_WIF_CLIENT_ID }}
          tailscale-audience: ${{ secrets.TS_WIF_AUDIENCE }}

      - name: Commit and push lockfile
        env:
          # An App token, so the push re-triggers CI (a GITHUB_TOKEN push would not).
          PUSH_TOKEN: ${{ steps.bao.outputs.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: sync uv.lock with release version"
          git push "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${HEAD_REF}"
