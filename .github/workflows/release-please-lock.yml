name: Release Please Lock

# release-please bumps the version in pyproject.toml but has no uv.lock updater, so the
# release PR ships a uv.lock whose own-package version is one release behind. That fails
# CI's `uv sync --locked`. This workflow reacts to the release PR, regenerates uv.lock, and
# pushes the result back under the PAT (so CI re-runs), leaving the lock consistent for merge.
# It is idempotent: once locked, `uv lock` produces no diff, so it self-terminates.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

# Workflow-level lockdown; the single job grants only what it needs. The push authenticates
# as the PAT (RELEASE_PLEASE_TOKEN), not GITHUB_TOKEN, so no contents:write is needed here.
permissions: {}

concurrency:
  group: release-please-lock-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  relock:
    name: Regenerate uv.lock
    # Only release-please PRs from this repository. The secret-bearing push runs in a
    # separate job that never executes PR-controlled dependency/build metadata.
    if: >-
      startsWith(github.head_ref, 'release-please--') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.pull_request.user.login == 'github-actions[bot]' ||
       github.event.pull_request.user.login == 'release-please[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Regenerate lockfile
        run: uv lock

      - name: Check for lockfile changes
        id: diff
        run: |
          set -euo pipefail
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already in sync — nothing to do"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Upload regenerated lockfile
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: regenerated-uv-lock
          path: uv.lock
          if-no-files-found: error

  push-lockfile:
    name: Push regenerated uv.lock
    needs: relock
    if: needs.relock.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false

      - name: Download regenerated lockfile
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: regenerated-uv-lock

      - name: Commit and push lockfile
        env:
          # PAT so the push re-triggers CI (a GITHUB_TOKEN push would not); masked in logs.
          PUSH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: sync uv.lock with release version"
          git push "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${HEAD_REF}"
