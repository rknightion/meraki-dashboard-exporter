name: Failure harness

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Failure mode, or all
        required: true
        default: all
        type: string

permissions: {}

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"
          activate-environment: true
      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.58.0'
      - run: uv sync --locked
      - name: Build local exporter image
        run: just harness-image
      - name: Run selected replay
        env:
          HARNESS_MODE: ${{ inputs.mode }}
        run: just harness-run "${HARNESS_MODE}"
      - name: Upload redacted failure-harness artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: failure-harness-artifacts
          path: .failure-harness-artifacts
          if-no-files-found: warn
