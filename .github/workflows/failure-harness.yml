name: Failure harness

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Failure mode, or all
        required: true
        default: all
        type: string

permissions: {}

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          activate-environment: true
      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.59.0'
      - run: uv sync --locked
      - name: Build local exporter image
        run: just harness-image
      - name: Run selected replay
        env:
          HARNESS_MODE: ${{ inputs.mode }}
        run: just harness-run "${HARNESS_MODE}"
      - name: Upload redacted failure-harness artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failure-harness-artifacts
          path: .failure-harness-artifacts
          if-no-files-found: warn
