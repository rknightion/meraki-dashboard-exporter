name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Minimal default; write scopes are granted per-job only where needed.
permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # exchanged for a tailnet identity and an OpenBao token
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      # Mints a short-lived GitHub App installation token scoped to THIS repo,
      # replacing RELEASE_PLEASE_TOKEN -- a PAT scoped across every rknightion repo.
      # Nothing durable is stored here to leak. The release PR's author becomes the
      # App rather than rknightion; CI still runs unattended on it, because the
      # action_required gate applies to github-actions[bot], not to bot identities
      # generally -- Renovate, a GitHub App, already runs fine.
      #
      # Releases now depend on camden being up, unsealed and on the tailnet; a
      # failure here is infrastructure, not the commit.
      - name: Mint a scoped release token
        id: bao
        uses: rknightion/.github/.github/actions/broker-token@3eccd1b2f86c998fde32790f370da41d10a4c89b # v1.9.1
        with:
          permission-set: release-please-meraki-dashboard-exporter
          role: release-please-meraki-dashboard-exporter
          tailscale-client-id: ${{ secrets.TS_WIF_CLIENT_ID }}
          tailscale-audience: ${{ secrets.TS_WIF_AUDIENCE }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ steps.bao.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  prepend-release-warning:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Prepend limited-testing warning to release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          warning=$(cat <<'EOF'
          > [!WARNING]
          > I no longer have access to a Meraki network with anything other than MT, MR & MS devices. Changes affecting other device types (MX, MG, MV) are best-effort and driven from publicly available API documentation and SDK references rather than tested against live hardware.
          > If you are willing to work with myself to boost support for other device types or add coverage please reach out!
          EOF
          )
          current_body=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
          printf '%s\n\n%s' "$warning" "$current_body" \
            | gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file -

  docker-release:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      security-events: write
    uses: ./.github/workflows/publish.yml
    with:
      # Pass the release tag so publish can emit semver + latest image tags
      # (the workflow_call github context is the caller's push/main event).
      release_tag: ${{ needs.release-please.outputs.tag_name }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # Edge build on every non-release push to main: publishes :main multi-arch image
  # + a main-snapshot Helm chart (replaces the removed docker-build.yml push:main path).
  # release_created gates this vs docker-release, so they never both run on one push.
  # !cancelled() (not the implicit success()) so a release-please failure — e.g. an expired
  # RELEASE_PLEASE_TOKEN making the release job 401 — no longer silently freezes edge :main
  # publishing on ordinary pushes; a failed release job yields an empty release_created output,
  # which is != 'true', so edge still runs.
  edge:
    needs: release-please
    if: ${{ !cancelled() && needs.release-please.outputs.release_created != 'true' }}
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      security-events: write
    uses: ./.github/workflows/publish.yml
    with:
      release_tag: ""
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
