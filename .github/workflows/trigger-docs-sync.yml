name: Trigger Documentation Sync

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'docs.toml'
      - 'scripts/**'
  workflow_dispatch:

# Dispatch is authenticated with a per-run GitHub App token from the OpenBao
# broker (see the mint step below), not GITHUB_TOKEN and no longer a stored PAT.
permissions: {}

concurrency:
  group: docs-sync-${{ github.repository }}
  cancel-in-progress: true

jobs:
  trigger-sync:
    # id-token: write must be granted on the job that mints; the
    # workflow-level block above does not cover it.
    permissions:
      contents: read
      id-token: write # exchanged for a tailnet identity and an OpenBao token
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      # Mints a GitHub App installation token carrying contents:write on the docs
      # hub ONLY, replacing DOCS_SYNC_PAT. Nothing durable is stored in this repo.
      # contents:write really is what the dispatch endpoint wants -- actions:write
      # is the intuitive wrong answer.
      #
      # Docs sync now depends on camden being up, unsealed and on the tailnet. The
      # hub's daily 06:00 UTC cron rebuild remains the backstop if this fails.
      - name: Mint a scoped docs-sync token
        id: bao
        uses: rknightion/.github/.github/actions/broker-token@0e56520d848f5fda8cbfa0bda17797ef41f2a5a7 # v1.9.8
        with:
          permission-set: docs-sync
          # One shared permission set, but a role per repo to pin repository_id --
          # so unlike the release-please lane these two names differ.
          role: docs-sync-meraki-dashboard-exporter
          tailscale-client-id: ${{ secrets.TS_WIF_CLIENT_ID }}
          tailscale-audience: ${{ secrets.TS_WIF_AUDIENCE }}

      - name: Trigger documentation sync in parent repo
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4
        with:
          token: ${{ steps.bao.outputs.token }}
          repository: m7kni/m7kni-net-site
          event-type: docs-update
          client-payload: '{"repository": "meraki-dashboard-exporter"}'
