name: publish

on:
  workflow_call:
    inputs:
      release_tag:
        description: "vX.Y.Z to publish; empty = edge :main build"
        required: false
        type: string
        default: ""
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      release_tag:
        description: "vX.Y.Z to publish; empty = edge :main test"
        required: false
        type: string
        default: ""

# Minimal top-level default; write scopes granted per-job only.
permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      app_version: ${{ steps.build_metadata.outputs.app_version || github.sha }}
      sha: ${{ steps.build_metadata.outputs.sha || github.sha }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout publication ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.sha }}
          persist-credentials: false

      - name: Resolve tagged build metadata
        id: build_metadata
        if: ${{ inputs.release_tag != '' }}
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          echo "app_version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate vulnerability exceptions
        run: python3 scripts/validate_trivy_exceptions.py

  codeql:
    permissions:
      contents: read
      packages: read
      actions: read
      security-events: write
    uses: rknightion/.github/.github/workflows/codeql.yml@8ea95233ce0b1b2880124f745238e8d194524365 # v1.32.1
    with:
      languages: '[{"language":"python","build-mode":"none"},{"language":"actions","build-mode":"none"}]'
      ref: ${{ inputs.release_tag || github.sha }}
      category-suffix: /publish-gate
      fail-on-security-severity: high

  image:
    needs: [policy, codeql]
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      security-events: write
    uses: rknightion/.github/.github/workflows/container-publish.yml@8ea95233ce0b1b2880124f745238e8d194524365 # v1.32.1
    with:
      release-tag: ${{ inputs.release_tag }}
      # A release candidate (vX.Y.Z-rc.N) pushes only its own tag; :main and
      # :main-<sha> come from the edge build alone (#967).
      publish-branch-tags-on-prerelease: false
      helm-chart-path: charts/meraki-dashboard-exporter
      build-args: |
        PY_VERSION=3.15
        APP_VERSION=${{ needs.policy.outputs.app_version }}
        GIT_COMMIT=${{ needs.policy.outputs.sha }}
      dockerhub-login: true
      trivy-ignore-file: .trivyignore.yaml
      # Gate only on findings that have a fix available for the scanned distribution.
      trivy-ignore-unfixed: true
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
