name: publish

on:
  workflow_call:
    inputs:
      release_tag:
        description: "vX.Y.Z to publish; empty = edge :main build"
        required: false
        type: string
        default: ""
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      release_tag:
        description: "vX.Y.Z to publish; empty = edge :main test"
        required: false
        type: string
        default: ""
  # Build-only validation gate on the merge queue: the reusable builds both arches
  # WITHOUT pushing (catches arch-specific Python wheel breakage before main — issue #221).
  merge_group:

# Minimal top-level default; write scopes granted per-job only.
permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout publication ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.sha }}
          persist-credentials: false

      - name: Validate vulnerability exceptions
        run: python3 scripts/validate_trivy_exceptions.py

  codeql:
    permissions:
      contents: read
      packages: read
      actions: read
      security-events: write
    uses: rknightion/.github/.github/workflows/codeql.yml@c36bf7ded21407b0a5169ecb2502d6a3a385be30 # v1.25.5
    with:
      languages: '[{"language":"python","build-mode":"none"},{"language":"actions","build-mode":"none"}]'
      ref: ${{ inputs.release_tag || github.sha }}
      category-suffix: /publish-gate
      fail-on-security-severity: high

  image:
    needs: [policy, codeql]
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      security-events: write
    uses: rknightion/.github/.github/workflows/container-publish.yml@c36bf7ded21407b0a5169ecb2502d6a3a385be30 # v1.25.5
    with:
      release-tag: ${{ inputs.release_tag }}
      helm-chart-path: charts/meraki-dashboard-exporter
      build-args: |
        PY_VERSION=3.14
        APP_VERSION=${{ inputs.release_tag || github.sha }}
        GIT_COMMIT=${{ github.sha }}
      dockerhub-login: true
      trivy-ignore-file: .trivyignore.yaml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
