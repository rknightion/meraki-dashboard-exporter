name: CI

on:
  push:
    branches: [main]
  pull_request:
    # The acceptance-evidence check reads the pull request body, so it runs in pr-metadata.yml;
    # a body edit does not re-run this workflow.
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday at 6am UTC

permissions:
  contents: read
  pull-requests: read

# Cancel a superseded run on the same ref (rapid pushes / PR updates) to free runners.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast paths (rknightion/.github docs/changes/README.md): a Renovate pull request that only moves
  # hub reusable workflow pins, a release-please pull request or a vend-sync pull request skips the
  # application suites gated on `needs.changes.outputs.app` below. Lint, security checks and
  # ci-success always run. No `if:`: on any event but a pull request it answers app 'true'.
  changes:
    permissions:
      contents: read
    uses: rknightion/.github/.github/workflows/changes.yml@c2c3d98e29e9f340620d8ef396a8e6dcb45bda68 # v1.37.0
    with:
      version-files: |
        # release-please's extra-file (the chart's x-release-please-version appVersion line) and the
        # python strategy's pyproject.toml, plus uv.lock that release-please-lock.yml re-locks. The
        # classifier reads the last two as more than marker lines, and it knows only a root
        # CHANGELOG.md, not docs/changelog.md, so a release pull request here still runs everything.
        charts/meraki-dashboard-exporter/Chart.yaml
        pyproject.toml
        uv.lock
      vended-paths: |
        .agents/skills/**
        .claude/skills/**
        CONTRIBUTING.md
        AGENTS.md
        .github/pull_request_template.md
        .github/privacy/sweep
        .github/privacy/identifier-patterns.txt
        .grafana/Dockerfile
        .vended.json

  test:
    needs: [changes]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Fork PRs don't receive repo secrets, so CODECOV_TOKEN/CODACY_PROJECT_TOKEN are empty on
    # them. codecov-action soft-fails on a missing token, but codacy-coverage-reporter-action
    # hard-errors (its uploader script requires a non-empty token), which would otherwise fail
    # this required job for every external contributor. The `secrets` context isn't available in
    # step-level `if:` conditions, so resolve availability into job-level env vars here (env IS
    # available at step-level `if:`) and gate the upload steps below on those.
    env:
      HAS_CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN != '' }}
      HAS_CODACY_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN != '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Ultra-fast dependency install & caching
      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.15"
          activate-environment: true
          enable-cache: true

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.59.0'

      - name: Install project (incl. dev extras)
        # --locked: fail if uv.lock is stale vs pyproject.toml (e.g. a version bump that
        # forgot to re-lock). release-please-lock.yml keeps the release PR's lock in sync.
        run: uv sync --locked

      - name: Gate
        run: just check

      - name: Architecture map drift
        run: just groma-check

      - name: Upload coverage
        if: success() && env.HAS_CODECOV_TOKEN == 'true'
        continue-on-error: true # reporting only; the local 80% pytest floor is the gate
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: rknightion/meraki-dashboard-exporter
          files: coverage.xml

      - name: Upload coverage to Codacy
        if: success() && env.HAS_CODACY_TOKEN == 'true'
        continue-on-error: true # reporting only; the local 80% pytest floor is the gate
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: coverage.xml

  docker-build-test:
    needs: [changes]
    if: needs.changes.outputs.app == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.59.0'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: meraki-dashboard-exporter:test
          cache-from: type=registry,ref=ghcr.io/rknightion/meraki-dashboard-exporter:buildcache-linux-${{ matrix.arch }}
          build-args: |
            PY_VERSION=3.15
            APP_VERSION=${{ github.sha }}
            GIT_COMMIT=${{ github.sha }}

      - name: Test Docker image startup
        if: matrix.arch == 'amd64'
        run: just image-verify meraki-dashboard-exporter:test

      - name: Install container-structure-test
        if: matrix.arch == 'amd64'
        run: |
          set -euo pipefail
          # Update both by hand: gh api repos/GoogleContainerTools/container-structure-test/releases/tags/v1.22.1 --jq '.assets[] | select(.name == "container-structure-test-linux-amd64") | .digest'
          CST_VERSION=1.22.1
          CST_SHA256=fa35e89512a8978585f76cf41397956d2e3a30c62c2ad3fb857b1597074d14ca
          mkdir -p "${RUNNER_TEMP}/bin"
          curl -sSfL "https://github.com/GoogleContainerTools/container-structure-test/releases/download/v${CST_VERSION}/container-structure-test-linux-amd64" \
            -o "${RUNNER_TEMP}/bin/container-structure-test"
          echo "${CST_SHA256}  ${RUNNER_TEMP}/bin/container-structure-test" | sha256sum --check --strict
          chmod +x "${RUNNER_TEMP}/bin/container-structure-test"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: Container structure test (entrypoint, port, non-root user, required files)
        if: matrix.arch == 'amd64'
        run: just image-structure meraki-dashboard-exporter:test

      - name: Serve smoke test (container up, GET /health + /metrics respond)
        run: just smoke meraki-dashboard-exporter:test

  # Chart validation moved to the shared reusable. Two things change vs the
  # hand-rolled job it replaces: kubeconform is now verified against the
  # release's own CHECKSUMS file (this job previously verified nothing at all),
  # and -ignore-missing-schemas is off, so an unschema'd kind fails instead of
  # being silently skipped. The render is core-API-only — serviceMonitor.enabled
  # defaults to false — so nothing here needs a CRD schema.
  helm-lint-kubeconform:
    needs: [changes]
    if: >-
      needs.changes.outputs.app == 'true'
      || contains(needs.changes.outputs.hub_workflows, '"helm-validate.yml"')
    permissions:
      contents: read
    uses: rknightion/.github/.github/workflows/helm-validate.yml@a6e7f83c8fd233841120fc14c0412124a445c306 # v1.35.0
    with:
      # This chart renders CRD kinds (ServiceMonitor + PrometheusRule) that kubeconform has no
      # built-in schema for. Give it the schema rather than reaching for
      # -ignore-missing-schemas: that flag skips EVERY unschema'd kind
      # silently, so the check passes while validating nothing. sf2loki
      # carried it for exactly that reason and its ExternalSecret and
      # SecretStore had therefore never once been validated.
      schema-locations: >-
        default
        https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
      chart-path: charts/meraki-dashboard-exporter
      release-name: test-release
      lint-args: --set meraki.apiKey=dummy
      permutations: --set meraki.apiKey=dummy

  # The lines a pull request adds carry no identifier, email address, public address or credential
  # shape. Pull requests only, for the same reason. Check run: `privacy-sweep / Privacy sweep`.
  privacy-sweep:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: rknightion/.github/.github/workflows/privacy-sweep.yml@a6e7f83c8fd233841120fc14c0412124a445c306 # v1.35.0

  # zizmor fails a pull request on any finding (enforce); push runs upload SARIF instead.
  zizmor:
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: rknightion/.github/.github/workflows/zizmor.yml@a6e7f83c8fd233841120fc14c0412124a445c306 # v1.35.0
    with:
      enforce: true

  # ci-success aggregates the CI jobs that branch protection and Renovate depend on.
  ci-success:
    name: ci-success
    runs-on: ubuntu-latest
    timeout-minutes: 6 # Leave time for job setup and the five-minute backlog check.
    if: always()
    needs: [changes, test, docker-build-test, helm-lint-kubeconform, privacy-sweep, zizmor]
    permissions:
      pull-requests: read
    steps:
      - name: Fail if any required job did not pass
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        env:
          RESULTS: ${{ join(needs.*.result, ', ') }}
        run: |
          echo "A required job failed or was cancelled: ${RESULTS}"
          exit 1
      # A skipped job reports success. It counts as a pass only when changes succeeded and said the
      # application suites need not run (rknightion/.github docs/changes/README.md).
      - name: Fail if an application suite was skipped without a verdict
        env:
          CHANGES: ${{ needs.changes.result }}
          APP: ${{ needs.changes.outputs.app }}
          SUITES: ${{ needs.test.result }} ${{ needs.docker-build-test.result }} ${{ needs.helm-lint-kubeconform.result }}
        run: |
          if [[ "$CHANGES" != success || ( "$APP" != true && "$APP" != false ) ]]; then
            echo "::error::changes gave no verdict (result $CHANGES, app '$APP')"
            exit 1
          fi
          for result in $SUITES; do
            if [[ "$APP" == true && "$result" != success ]]; then
              echo "::error::the application suites had to run, and one ended $result"
              exit 1
            fi
          done
      # Read the frozen backlog's file list without checking out the pull request.
      - name: Refuse additions and changes under backlog/
        id: backlog-freeze
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          set -euo pipefail
          if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ && "$CHANGED_FILES" =~ ^[0-9]+$ ]]; then
            echo "::error title=backlog freeze::the pull request number or file count is malformed"
            exit 1
          fi
          # The pull request files API lists at most 3000 files; refuse rather than check part of a change.
          if (( CHANGED_FILES > 3000 )); then
            echo "::error title=backlog freeze::${CHANGED_FILES} changed files is more than the API lists; split the pull request"
            exit 1
          fi
          offending="$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files?per_page=100" \
            --jq '.[] | select(.status != "removed") | select(.filename | startswith("backlog/")) | "\(.status) \(.filename | @json)"')"
          if [[ -n "$offending" ]]; then
            echo "::error title=backlog freeze::this pull request adds or changes files under backlog/; the board is retired, so file the work as an issue"
            printf '  %s\n' "$offending"
            exit 1
          fi
          echo "No file under backlog/ is added or changed."

      # These checks must have succeeded on a pull request. Other events skip them.
      - name: Fail if a pull request check did not run
        if: ${{ always() && github.event_name == 'pull_request' }}
        env:
          PRIVACY_SWEEP: ${{ needs.privacy-sweep.result }}
          BACKLOG_FREEZE: ${{ steps.backlog-freeze.outcome }}
        run: |
          if [[ "$PRIVACY_SWEEP" != "success" || "$BACKLOG_FREEZE" != "success" ]]; then
            echo "privacy-sweep: ${PRIVACY_SWEEP}, backlog-freeze: ${BACKLOG_FREEZE}; all must pass on a pull request"
            exit 1
          fi
      - name: All required jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ', ') }}
        run: echo "ci-success - ${RESULTS}"
