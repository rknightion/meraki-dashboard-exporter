name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `edited` re-runs CI when the pull request body changes, so the acceptance evidence check reads
    # the new table. The pull request jobs below run on every one of these types.
    types: [opened, edited, reopened, synchronize, ready_for_review]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday at 6am UTC

permissions:
  contents: read
  pull-requests: read

# Cancel a superseded run on the same ref (rapid pushes / PR updates) to free runners.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Fork PRs don't receive repo secrets, so CODECOV_TOKEN/CODACY_PROJECT_TOKEN are empty on
    # them. codecov-action soft-fails on a missing token, but codacy-coverage-reporter-action
    # hard-errors (its uploader script requires a non-empty token), which would otherwise fail
    # this required job for every external contributor. The `secrets` context isn't available in
    # step-level `if:` conditions, so resolve availability into job-level env vars here (env IS
    # available at step-level `if:`) and gate the upload steps below on those.
    env:
      HAS_CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN != '' }}
      HAS_CODACY_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN != '' }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Ultra-fast dependency install & caching
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          activate-environment: true
          enable-cache: true

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.59.0'

      - name: Install project (incl. dev extras)
        # --locked: fail if uv.lock is stale vs pyproject.toml (e.g. a version bump that
        # forgot to re-lock). release-please-lock.yml keeps the release PR's lock in sync.
        run: uv sync --locked

      - name: Gate
        run: just check

      - name: Architecture map drift
        run: just groma-check

      - name: Upload coverage
        if: success() && env.HAS_CODECOV_TOKEN == 'true'
        continue-on-error: true # reporting only; the local 80% pytest floor is the gate
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: rknightion/meraki-dashboard-exporter
          files: coverage.xml

      - name: Upload coverage to Codacy
        if: success() && env.HAS_CODACY_TOKEN == 'true'
        continue-on-error: true # reporting only; the local 80% pytest floor is the gate
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: coverage.xml

  docker-build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.59.0'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and test Docker image (amd64 only)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: meraki-dashboard-exporter:test
          cache-from: type=gha
          build-args: |
            PY_VERSION=3.14
            APP_VERSION=${{ github.sha }}
            GIT_COMMIT=${{ github.sha }}

      - name: Test Docker image startup
        run: just image-verify meraki-dashboard-exporter:test

      - name: Install container-structure-test
        run: |
          # renovate: datasource=github-releases depName=GoogleContainerTools/container-structure-test
          CST_VERSION=1.22.1
          mkdir -p "${RUNNER_TEMP}/bin"
          curl -sSfL "https://github.com/GoogleContainerTools/container-structure-test/releases/download/v${CST_VERSION}/container-structure-test-linux-amd64" \
            -o "${RUNNER_TEMP}/bin/container-structure-test"
          chmod +x "${RUNNER_TEMP}/bin/container-structure-test"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: Container structure test (entrypoint, port, non-root user, required files)
        run: just image-structure meraki-dashboard-exporter:test

      - name: Serve smoke test (container up, GET /health + /metrics respond)
        run: just smoke meraki-dashboard-exporter:test

  # Chart validation moved to the shared reusable. Two things change vs the
  # hand-rolled job it replaces: kubeconform is now verified against the
  # release's own CHECKSUMS file (this job previously verified nothing at all),
  # and -ignore-missing-schemas is off, so an unschema'd kind fails instead of
  # being silently skipped. The render is core-API-only — serviceMonitor.enabled
  # defaults to false — so nothing here needs a CRD schema.
  helm-lint-kubeconform:
    permissions:
      contents: read
    uses: rknightion/.github/.github/workflows/helm-validate.yml@3aee36ed9f327d9238e387c7af7da9ec5369a263 # v1.25.31
    with:
      # This chart renders CRD kinds (ServiceMonitor + PrometheusRule) that kubeconform has no
      # built-in schema for. Give it the schema rather than reaching for
      # -ignore-missing-schemas: that flag skips EVERY unschema'd kind
      # silently, so the check passes while validating nothing. sf2loki
      # carried it for exactly that reason and its ExternalSecret and
      # SecretStore had therefore never once been validated.
      schema-locations: >-
        default
        https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
      chart-path: charts/meraki-dashboard-exporter
      release-name: test-release
      lint-args: --set meraki.apiKey=dummy
      permutations: --set meraki.apiKey=dummy

  scheduled-fleet-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
          allow-prereleases: true
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.59.0'
      - name: Install dependencies
        run: uv sync --all-extras --locked
      - name: Run scheduled fleet presets
        run: just test-fleet-scheduled

  on-demand-fleet-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
          allow-prereleases: true
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.59.0'
      - name: Install dependencies
        run: uv sync --all-extras --locked
      - name: Run on-demand fleet presets
        run: just test-fleet-on-demand

  # A pull request that closes an issue shows evidence for each of its acceptance criteria. Checks
  # only pull requests with a closing keyword (enforce-all-prs: false), because this repository takes
  # outside and bot pull requests. The reusable fails on any event but pull_request, so it runs on
  # pull requests only. Check run: `ac-evidence / Acceptance evidence`.
  ac-evidence:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: rknightion/.github/.github/workflows/ac-evidence.yml@8f00b7fb896191e598f12ed565395697c539add1 # v1.26.9

  # The lines a pull request adds carry no identifier, email address, public address or credential
  # shape. Pull requests only, for the same reason. Check run: `privacy-sweep / Privacy sweep`.
  privacy-sweep:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: rknightion/.github/.github/workflows/privacy-sweep.yml@8f00b7fb896191e598f12ed565395697c539add1 # v1.26.9

  # Single required status check (the branch ruleset requires only this). if: always() + an explicit
  # failure check so a failed/cancelled leg fails the gate; the optional fleet jobs aren't
  # depended on. Renovate automerge waits for this to go green.
  ci-success:
    name: ci-success
    runs-on: ubuntu-latest
    if: always()
    needs: [test, docker-build-test, helm-lint-kubeconform, ac-evidence, privacy-sweep]
    steps:
      - name: Fail if any required job did not pass
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        env:
          RESULTS: ${{ join(needs.*.result, ', ') }}
        run: |
          echo "A required job failed or was cancelled: ${RESULTS}"
          exit 1
      # ac-evidence and privacy-sweep are skipped off a pull request (push, schedule, dispatch), which
      # counts as passing there. On a pull request a skipped job reports success, so they must have
      # actually run and passed.
      - name: Fail if a pull request check did not run
        if: ${{ github.event_name == 'pull_request' }}
        env:
          AC_EVIDENCE: ${{ needs.ac-evidence.result }}
          PRIVACY_SWEEP: ${{ needs.privacy-sweep.result }}
        run: |
          if [[ "$AC_EVIDENCE" != "success" || "$PRIVACY_SWEEP" != "success" ]]; then
            echo "ac-evidence: ${AC_EVIDENCE}, privacy-sweep: ${PRIVACY_SWEEP}; both must pass on a pull request"
            exit 1
          fi
      - name: All required jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ', ') }}
        run: echo "ci-success - ${RESULTS}"
