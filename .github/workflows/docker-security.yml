name: Docker Security
# Advisory scans only; publish.yml still gates release images.
on:
  schedule:
    - cron: '49 5 * * 3'
  workflow_dispatch:
permissions: {}
jobs:
  docker-security:
    permissions:
      contents: read
      security-events: write
